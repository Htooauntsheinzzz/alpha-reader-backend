spring:
  application:
    name: e-reader-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/alpha_web_default
    username: alphaadmin
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  data:
    redis:
      host: localhost
      port: 6379
  cache:
    type: redis

server:
  port: 8080

app:
  jwt:
    issuer: e-reader-api
    access-token-expiration-minutes: 15
    refresh-token-expiration-days: 7
    private-key-path: file:./keys/private.pem
    public-key-path: file:./keys/public.pem
