spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: e-reader-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/alpha_web_default
    username: alphaadmin
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:30000}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME_MS:1800000}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      repositories:
        enabled: false
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:alphaadmin}
    password: ${RABBITMQ_PASSWORD:alpha$67P@ssw0rd}
    connection-timeout: 5s
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: auto
        default-requeue-rejected: false
        retry:
          enabled: true
          initial-interval: 1s
          multiplier: 2
          max-interval: 10s
          max-attempts: 3
  cache:
    type: redis

server:
  port: 8080
  tomcat:
    threads:
      max: ${SERVER_THREADS_MAX:100}
      min-spare: ${SERVER_THREADS_MIN_SPARE:10}
    accept-count: ${SERVER_ACCEPT_COUNT:100}
    max-connections: ${SERVER_MAX_CONNECTIONS:8192}

app:
  jwt:
    issuer: e-reader-api
    access-token-expiration-minutes: 15
    refresh-token-expiration-days: 7
    private-key-path: file:./keys/private.pem
    public-key-path: file:./keys/public.pem
  messaging:
    exchange: alpha.events
    audit-queue: alpha.audit
    story-type-queue: story-type-events
    dead-letter-exchange: alpha.events.dlx
    dead-letter-queue: alpha.audit.dlq
    dead-letter-routing-key: audit.failed
    publisher-batch-size: 50
    publisher-max-retries: 10
    publisher-confirm-timeout-millis: 5000
    publisher-fixed-delay-millis: 5000
